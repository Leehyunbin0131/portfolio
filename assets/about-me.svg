<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">From code to motion.</title>
  <desc id="desc">A charcoal and coral robotics banner with a mobile robot following a path through a map.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#F2EFE5" stroke-opacity=".055"/>
    </pattern>
    <linearGradient id="fade" x1="640" y1="160" x2="1200" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#242423"/>
      <stop offset="1" stop-color="#242423" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="16" fill="#242423"/>
  <rect x="640" width="544" height="320" fill="url(#grid)"/>
  <rect x="640" width="544" height="320" fill="url(#fade)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="48" y="44" width="8" height="8" rx="2" fill="#D97757"/>
    <text x="68" y="55" fill="#C0B9A7" font-size="17" font-weight="600" letter-spacing="3">ROBOTICS / ROS 2</text>
    <text x="44" y="153" fill="#F2EFE5" font-size="80" font-weight="700" letter-spacing="-3">From code</text>
    <text x="44" y="239" fill="#F2EFE5" font-size="80" font-weight="700" letter-spacing="-3">to <tspan fill="#E89A7D">motion.</tspan></text>
    <path d="M48 276H112" stroke="#D97757" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- A small navigation map: obstacles, a planned route, and a mobile robot. -->
  <g stroke="#777260" stroke-width="2">
    <path d="M742 72H822V116H858"/>
    <path d="M1022 48H1110V112"/>
    <path d="M1080 224H1136V272H1038"/>
    <path d="M738 204V264H826"/>
  </g>
  <path d="M776 234H866Q890 234 890 210V174Q890 150 914 150H1022Q1046 150 1046 126V82" stroke="#D97757" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 9"/>
  <circle cx="776" cy="234" r="7" fill="#242423" stroke="#C0B9A7" stroke-width="2"/>
  <circle cx="1046" cy="82" r="14" stroke="#E89A7D" stroke-opacity=".35"/>
  <circle cx="1046" cy="82" r="6" fill="#E89A7D"/>

  <g transform="translate(942 150) rotate(15)">
    <circle r="94" stroke="#D97757" stroke-opacity=".1"/>
    <circle r="72" stroke="#D97757" stroke-opacity=".22"/>
    <path d="M0-72V-94M72 0H94M0 72V94M-72 0H-94" stroke="#D97757" stroke-opacity=".4"/>
    <rect x="-39" y="-30" width="14" height="60" rx="5" fill="#A39B87"/>
    <rect x="25" y="-30" width="14" height="60" rx="5" fill="#A39B87"/>
    <rect x="-30" y="-43" width="60" height="86" rx="19" fill="#D97757" stroke="#E89A7D" stroke-width="2"/>
    <rect x="-19" y="-28" width="38" height="22" rx="8" fill="#242423"/>
    <circle cy="17" r="13" fill="#242423" stroke="#E89A7D" stroke-width="2"/>
    <circle cy="17" r="4" fill="#F2EFE5"/>
    <path d="M-7-17H7M0-24V-10" stroke="#E89A7D" stroke-width="2" stroke-linecap="round"/>
  </g>
  <path d="M1184 24V296" stroke="#D97757" stroke-width="3" stroke-linecap="round"/>
</svg>
